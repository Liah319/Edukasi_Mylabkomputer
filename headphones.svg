  <rect x="42" y="102" width="12" height="42" rx="6" fill="#81e6d9"/>
  <!-- Right Earcup -->
  <rect x="149" y="95" width="26" height="55" rx="13" fill="#2d3748" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.2))"/>
  <rect x="146" y="102" width="12" height="42" rx="6" fill="#81e6d9"/>
  <!-- Music Waves -->
  <path d="M 15 110 Q 8 122 15 135" stroke="#f6ad55" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 185 110 Q 192 122 185 135" stroke="#f6ad55" stroke-width="3" fill="none" stroke-linecap="round"/>
