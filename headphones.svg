  </defs>
  <!-- Headband Arch -->
  <path d="M 40 110 A 65 65 0 0 1 160 110" fill="none" stroke="url(#headbandGrad)" stroke-width="14" stroke-linecap="round" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.15))"/>
  <!-- Top Cushion -->
  <path d="M 70 55 A 40 40 0 0 1 130 55" fill="none" stroke="#2d3748" stroke-width="8" stroke-linecap="round"/>
  <!-- Left Earcup -->
