<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="kbBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#edf2f7"/>
      <stop offset="100%" stop-color="#cbd5e0"/>
    </linearGradient>
  </defs>
  <!-- Cable -->
  <path d="M 100 50 Q 100 20 130 20" stroke="#718096" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Keyboard Base -->
  <rect x="15" y="50" width="170" height="110" rx="16" fill="url(#kbBody)" filter="drop-shadow(0px 6px 8px rgba(0,0,0,0.2))"/>
  <rect x="22" y="58" width="156" height="94" rx="10" fill="#e2e8f0"/>

  <!-- Colorful Rainbow Keycaps Row 1 -->
  <rect x="28" y="65" width="18" height="16" rx="4" fill="#fc8181"/>
  <rect x="50" y="65" width="18" height="16" rx="4" fill="#f6ad55"/>
  <rect x="72" y="65" width="18" height="16" rx="4" fill="#f6e05e"/>
  <rect x="94" y="65" width="18" height="16" rx="4" fill="#68d391"/>
  <rect x="116" y="65" width="18" height="16" rx="4" fill="#4fd1c5"/>
  <rect x="138" y="65" width="18" height="16" rx="4" fill="#63b3ed"/>
  <rect x="160" y="65" width="14" height="16" rx="4" fill="#b794f4"/>

  <!-- Row 2 -->
  <rect x="28" y="85" width="22" height="16" rx="4" fill="#fbb6ce"/>
  <rect x="54" y="85" width="18" height="16" rx="4" fill="#fed7d7"/>
  <rect x="76" y="85" width="18" height="16" rx="4" fill="#feebc8"/>
  <rect x="98" y="85" width="18" height="16" rx="4" fill="#c6f6d5"/>
  <rect x="120" y="85" width="18" height="16" rx="4" fill="#bee3f8"/>
  <rect x="142" y="85" width="32" height="16" rx="4" fill="#e9d8fd"/>

  <!-- Row 3 -->
  <rect x="28" y="105" width="26" height="16" rx="4" fill="#feebc8"/>
  <rect x="58" y="105" width="18" height="16" rx="4" fill="#fed7d7"/>
  <rect x="80" y="105" width="18" height="16" rx="4" fill="#c6f6d5"/>
  <rect x="102" y="105" width="18" height="16" rx="4" fill="#bee3f8"/>
  <rect x="124" y="105" width="18" height="16" rx="4" fill="#e9d8fd"/>
  <rect x="146" y="105" width="28" height="16" rx="4" fill="#fed7e2"/>

  <!-- Row 4: Spacebar & Arrow keys -->
  <rect x="28" y="125" width="22" height="18" rx="4" fill="#4299e1"/>
  <rect x="54" y="125" width="70" height="18" rx="5" fill="#48bb78"/>
  <!-- Spacebar cute smiley -->
  <text x="89" y="138" font-family="Arial" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">SPACE</text>
  <rect x="128" y="125" width="20" height="18" rx="4" fill="#ed8936"/>
  <rect x="152" y="125" width="22" height="18" rx="4" fill="#9f7aea"/>
</svg>
