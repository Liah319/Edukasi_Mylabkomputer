<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="prtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f7aea"/>
      <stop offset="100%" stop-color="#805ad5"/>
    </linearGradient>
  </defs>
  <!-- Top Paper feeder sheet -->
  <rect x="55" y="20" width="90" height="50" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="2"/>
  <line x1="65" y1="35" x2="135" y2="35" stroke="#e2e8f0" stroke-width="3"/>
  <line x1="65" y1="45" x2="120" y2="45" stroke="#e2e8f0" stroke-width="3"/>
  <!-- Printer Body -->
  <rect x="25" y="60" width="150" height="85" rx="16" fill="url(#prtGrad)" filter="drop-shadow(0px 8px 10px rgba(0,0,0,0.2))"/>
  <rect x="35" y="70" width="130" height="30" rx="8" fill="#553c9a"/>
  <!-- Output paper tray slot -->
  <rect x="40" y="110" width="120" height="20" rx="4" fill="#44337a"/>
  <!-- Printed Output Paper coming out -->
  <rect x="50" y="115" width="100" height="65" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.15))"/>
  <!-- Rainbow Drawing on Printed Paper -->
  <path d="M 65 160 A 35 35 0 0 1 135 160" stroke="#fc8181" stroke-width="5" fill="none"/>
  <path d="M 72 160 A 28 28 0 0 1 128 160" stroke="#f6ad55" stroke-width="5" fill="none"/>
  <path d="M 79 160 A 21 21 0 0 1 121 160" stroke="#68d391" stroke-width="5" fill="none"/>
  <!-- Power & Status Lights -->
  <circle cx="140" cy="85" r="4" fill="#48bb78"/>
  <circle cx="150" cy="85" r="4" fill="#ecc94b"/>
</svg>
