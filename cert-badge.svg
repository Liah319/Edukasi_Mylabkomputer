<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecc94b"/>
      <stop offset="50%" stop-color="#d69e2e"/>
      <stop offset="100%" stop-color="#b7791f"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e53e3e"/>
      <stop offset="100%" stop-color="#9b2c2c"/>
    </linearGradient>
  </defs>
  <!-- Ribbons at the bottom -->
  <polygon points="75,120 60,180 85,165 100,180 90,120" fill="url(#ribbonGrad)"/>
  <polygon points="125,120 140,180 115,165 100,180 110,120" fill="url(#ribbonGrad)"/>
  <!-- Rosette outer rays -->
  <circle cx="100" cy="85" r="55" fill="url(#goldGrad)" filter="drop-shadow(0px 6px 8px rgba(0,0,0,0.25))"/>
  <circle cx="100" cy="85" r="46" fill="#fffaf0"/>
  <circle cx="100" cy="85" r="42" fill="url(#goldGrad)"/>
  <!-- Star in Center -->
  <polygon points="100,55 108,74 128,74 112,86 118,105 100,93 82,105 88,86 72,74 92,74" fill="#ffffff"/>
  <text x="100" y="125" font-family="'Fredoka', 'Quicksand', sans-serif" font-size="14" font-weight="bold" fill="#744210" text-anchor="middle">ANAK HEBAT</text>
</svg>
