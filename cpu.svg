<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cpuBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="glowFan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ed64a6"/>
      <stop offset="100%" stop-color="#9f7aea"/>
    </linearGradient>
  </defs>
  <!-- Main Case -->
  <rect x="45" y="20" width="110" height="160" rx="16" fill="url(#cpuBody)" filter="drop-shadow(0px 8px 10px rgba(0,0,0,0.25))"/>
  <!-- Front Panel Accent -->
  <rect x="55" y="30" width="90" height="140" rx="10" fill="#2d3748"/>
  <!-- DVD Drive slot -->
  <rect x="65" y="42" width="70" height="12" rx="4" fill="#4a5568"/>
  <line x1="72" y1="48" x2="128" y2="48" stroke="#718096" stroke-width="2"/>
  <circle cx="125" cy="48" r="1.5" fill="#e2e8f0"/>
  <!-- Power Button (Large & Glowy) -->
  <circle cx="100" cy="75" r="14" fill="#48bb78" filter="drop-shadow(0 0 6px #48bb78)"/>
  <circle cx="100" cy="75" r="8" fill="#38a169"/>
  <path d="M 100 70 L 100 74 M 96 73 A 5 5 0 1 0 104 73" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- USB Ports & Audio Jack -->
  <rect x="68" y="100" width="14" height="6" rx="2" fill="#1a202c"/>
  <rect x="88" y="100" width="14" height="6" rx="2" fill="#1a202c"/>
  <circle cx="118" cy="103" r="3.5" fill="#fc8181"/>
  <circle cx="128" cy="103" r="3.5" fill="#68d391"/>
  <!-- RGB Glowing Cooling Fan Grid -->
  <circle cx="100" cy="140" r="22" fill="url(#glowFan)" opacity="0.85"/>
  <circle cx="100" cy="140" r="18" fill="#1a202c"/>
  <circle cx="100" cy="140" r="5" fill="#ed64a6"/>
  <!-- Fan Blades -->
  <path d="M 100 140 Q 95 125 100 123 Q 105 125 100 140" fill="#9f7aea"/>
  <path d="M 100 140 Q 115 135 117 140 Q 115 145 100 140" fill="#9f7aea"/>
  <path d="M 100 140 Q 105 155 100 157 Q 95 155 100 140" fill="#9f7aea"/>
  <path d="M 100 140 Q 85 145 83 140 Q 85 135 100 140" fill="#9f7aea"/>
</svg>
