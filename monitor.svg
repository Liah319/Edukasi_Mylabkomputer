<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="monFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <linearGradient id="monScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#63b3ed"/>
      <stop offset="100%" stop-color="#4299e1"/>
    </linearGradient>
  </defs>
  <!-- Stand Base -->
  <ellipse cx="100" cy="180" rx="35" ry="10" fill="#718096"/>
  <!-- Stand Neck -->
  <rect x="92" y="140" width="16" height="42" rx="4" fill="#a0aec0"/>
  <!-- Outer Bezel -->
  <rect x="25" y="30" width="150" height="115" rx="16" fill="url(#monFrame)" filter="drop-shadow(0px 6px 6px rgba(0,0,0,0.2))"/>
  <!-- Inner Screen -->
  <rect x="35" y="40" width="130" height="90" rx="10" fill="url(#monScreen)"/>
  <!-- Landscape on Screen (Sun and Mountain) -->
  <circle cx="135" cy="65" r="14" fill="#f6e05e"/>
  <polygon points="45,130 80,75 115,130" fill="#48bb78"/>
  <polygon points="90,130 125,85 155,130" fill="#38a169"/>
  <!-- Cute Face on Screen -->
  <circle cx="70" cy="65" r="4" fill="#2d3748"/>
  <circle cx="95" cy="65" r="4" fill="#2d3748"/>
  <path d="M 78 72 Q 82.5 78 87 72" stroke="#2d3748" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Power LED -->
  <circle cx="100" cy="138" r="2.5" fill="#48bb78"/>
</svg>
